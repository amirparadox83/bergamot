# build.yaml — Bergamot
# محدود کردن builders به فایل‌های مرتبط برای جلوگیری از خطاهای drift_dev
# روی فایل‌های غیر-Drift (مثل bergamot_text_normalizer.dart).

targets:
  $default:
    builders:
      drift_dev:
        enabled: true
        generate_for:
          include:
            - lib/data/database/*.dart
            - lib/data/database/tables/*.dart
      json_serializable:
        enabled: true
        generate_for:
          include:
            - lib/domain/services/*.dart
